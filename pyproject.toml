[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlsys"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
mlsys = "mlsys.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlsys"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.33",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]


[tool.pytest.ini_options]
testpaths = ["tests"]
