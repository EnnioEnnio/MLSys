- name: wine_reviews
  hf_repo: spawn99/wine-reviews
  splits:
    train: train
    val: validation
    test: test
  target_column: points
  target_type: regression
  text_template: "description: {description}, variety: {variety}, country: {country}, price: {price} USD"

- name: usa_real_estate
  hf_repo: jason1966/ahmedshahriarsakib_usa-real-estate-dataset
  base_split: train
  # shuffle is only deterministic for a pinned `datasets` version — keep envs in sync
  shuffle_seed: 42
  splits:
    train: "196630"
    val: "28090"
    test: "56181"
  target_column: price
  target_type: regression
  text_template: "status: {status}, bed: {bed}, bath: {bath}, acre_lot: {acre_lot}, street: {street}, city: {city}, state: {state}, zip_code: {zip_code}, house_size: {house_size}, prev_sold_date: {prev_sold_date}"

# *_tiny: JIT-model-replacement data budget (~2k train rows, issue #69 follow-up).
# Val is deliberately large relative to train (1/3 of the labeled budget); test keeps
# the full-size split so the measurement noise floor matches the full configs.

- name: wine_reviews_tiny
  hf_repo: spawn99/wine-reviews
  splits:
    train: "train[:2000]"
    val: "validation[:1000]"
    test: test
  target_column: points
  target_type: regression
  text_template: "description: {description}, variety: {variety}, country: {country}, price: {price} USD"

- name: usa_real_estate_tiny
  hf_repo: jason1966/ahmedshahriarsakib_usa-real-estate-dataset
  base_split: train
  # same seed as usa_real_estate → tiny train is a strict subset of the full train split
  shuffle_seed: 42
  splits:
    train: "2000"
    val: "1000"
    test: "56181"
  target_column: price
  target_type: regression
  text_template: "status: {status}, bed: {bed}, bath: {bath}, acre_lot: {acre_lot}, street: {street}, city: {city}, state: {state}, zip_code: {zip_code}, house_size: {house_size}, prev_sold_date: {prev_sold_date}"

# *_log: log-price variants for the heavy-tail hypothesis. std(price) is ~14x the typical
# MAE on this dataset, so r2 = 1 - MSE/Var(y) pins the whole pool near zero while the models
# rank houses fine (METHOD.md, "The heavy tail, and what a log target does"). Regressing on
# log(price) attacks that in the numerator: it is the training loss, not just the readout.
# Same shuffle_seed as the untransformed variant, so the shuffle and the split slicing are
# identical. Membership is then a strict SUBSET, not a row-for-row match: the log path also
# drops rows with price <= 0, which log() cannot represent. Quantify that drop before
# claiming the frozen/finetune comparison against usa_real_estate is like-for-like.

- name: usa_real_estate_log
  hf_repo: jason1966/ahmedshahriarsakib_usa-real-estate-dataset
  base_split: train
  shuffle_seed: 42
  splits:
    train: "196630"
    val: "28090"
    test: "56181"
  target_column: price
  target_type: regression
  target_transform: log
  text_template: "status: {status}, bed: {bed}, bath: {bath}, acre_lot: {acre_lot}, street: {street}, city: {city}, state: {state}, zip_code: {zip_code}, house_size: {house_size}, prev_sold_date: {prev_sold_date}"

- name: usa_real_estate_log_tiny
  hf_repo: jason1966/ahmedshahriarsakib_usa-real-estate-dataset
  base_split: train
  shuffle_seed: 42
  splits:
    train: "2000"
    val: "1000"
    test: "56181"
  target_column: price
  target_type: regression
  target_transform: log
  text_template: "status: {status}, bed: {bed}, bath: {bath}, acre_lot: {acre_lot}, street: {street}, city: {city}, state: {state}, zip_code: {zip_code}, house_size: {house_size}, prev_sold_date: {prev_sold_date}"

