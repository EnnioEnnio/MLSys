[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlsys"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    # >=3.0: loads hub datasets directly (no per-dataset loading script). Older
    # versions (e.g. the 1.1.1 preinstalled in some NGC containers) chase a
    # missing <repo>.py script and fail. Pin forces `pip install -e .` to upgrade.
    "datasets>=3.0",
    "sentence-transformers",
    "model2vec",
    "huggingface_hub",
    "pyyaml",
    "numpy",
    "scipy",
    "tqdm",
    "wandb",
    "python-dotenv",
    "sentencepiece",
    "protobuf",
]

[project.scripts]
mlsys = "mlsys.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlsys"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.10",
    "ty>=0.0.33",
    "pre-commit>=4.0",
]
# Result-analysis / report-generation deps. Kept out of core so the cluster/CI
# install stays light (they're only needed to run `mlsys analyze` / `mlsys regret`
# locally). Install with `uv sync --group analysis`; imported lazily inside
# `mlsys.analysis.*` so config-only commands and CPU tests never pull them in.
analysis = [
    "pandas",
    "matplotlib",
    "seaborn",
]

[tool.uv]
# `analysis` carries only light pure-Python/plotting deps (pandas/matplotlib/seaborn), so we
# install it in dev environments by default — this keeps `ty check` (which must resolve the
# lazy `import pandas` inside mlsys.analysis) green in CI. It is deliberately NOT in
# `[project.dependencies]`, so the cluster's `pip install -e .` stays light (core deps only).
default-groups = ["dev", "analysis"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests download real models / need network; skipped by default and
# in CI. Run them explicitly with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: real-model end-to-end smoke; needs network + heavier deps",
]
